<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparaison GitHub vs Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 18px;
            color: #6e6e73;
            margin-bottom: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #1d1d1f;
        }

        .stat-label {
            font-size: 13px;
            color: #6e6e73;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .main-table {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            overflow-x: auto;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            border: 1px solid #e5e5e7;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #0066cc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6e6e73;
            border-bottom: 2px solid #e5e5e7;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background: #f5f5f7;
        }

        th.sort-asc::after {
            content: " ▲";
            font-size: 10px;
        }

        th.sort-desc::after {
            content: " ▼";
            font-size: 10px;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid #e5e5e7;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .project-name {
            font-weight: 500;
            color: #1d1d1f;
        }

        .project-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            object-fit: cover;
            margin-right: 10px;
            vertical-align: middle;
            border: 1px solid #e5e5e7;
        }

        .project-icon-placeholder {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            margin-right: 10px;
            vertical-align: middle;
            border: 1px solid #e5e5e7;
            background: #f3f4f6;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .project-icon-placeholder svg {
            width: 14px;
            height: 14px;
            color: #9ca3af;
        }

        .project-cell {
            display: flex;
            align-items: center;
        }

        .status-local, .status-github {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }

        .status-ok {
            background: #dcfce7;
            color: #166534;
        }

        .status-ko {
            background: #fee2e2;
            color: #991b1b;
        }

        .status-text {
            font-weight: 500;
        }

        .tag {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        .tag-fork {
            background: #fef3c7;
            color: #92400e;
        }

        .tag-old {
            background: #e5e5e7;
            color: #6e6e73;
        }

        .tag-no-git {
            background: #fecaca;
            color: #991b1b;
        }

        .tag-no-remote {
            background: #fed7aa;
            color: #9a3412;
        }

        .tag-dirty {
            background: #e9d5ff;
            color: #6b21a8;
        }

        .tag-alias {
            background: #cffafe;
            color: #0e7490;
        }

        .tag-private {
            background: #e0e7ff;
            color: #4338ca;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
        }

        .cat-chrome { background: #fee2e2; color: #991b1b; }
        .cat-cli { background: #dcfce7; color: #166534; }
        .cat-macos { background: #f3e8ff; color: #6b21a8; }
        .cat-vs { background: #dbeafe; color: #1e40af; }
        .cat-web { background: #d1fae5; color: #065f46; }
        .cat-wp { background: #fef3c7; color: #92400e; }
        .cat-other { background: #e5e5e7; color: #6e6e73; }

        .github-link {
            color: #0066cc;
            text-decoration: none;
            font-size: 13px;
        }

        .github-link:hover {
            text-decoration: underline;
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid #e5e5e7;
            background: white;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            background: #f5f5f7;
        }

        .filter-btn.active {
            background: #1d1d1f;
            color: white;
            border-color: #1d1d1f;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            font-size: 13px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>

                }
                // Always add placeholder as fallback (hidden if image loads)
                iconHtml += `<span class="project-icon-placeholder" style="${project.iconPath ? 'display:none;' : ''}"><svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 16 16"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM4.5 7.5a.5.5 0 0 0 0 1h5.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L7.293 7.5H4.5z"/></svg></span>`;

                row.innerHTML = `
                    <td><div class="project-cell">${iconHtml}<span class="project-name">${project.name}</span></div></td>
                    <td><span class="category-badge ${categoryClass}">${categoryName}</span></td>
                    <td>
                        ${project.hasLocal
                            ? '<span class="status-local"><span class="status-icon status-ok">✓</span> <span class="status-text">OK</span></span>'
                            : '<span class="status-local"><span class="status-icon status-ko">✗</span> <span class="status-text">KO</span></span>'
                        }
                    </td>
                    <td>
                        ${project.hasGithub
                            ? '<span class="status-github"><span class="status-icon status-ok">✓</span> <span class="status-text">OK</span></span>'
                            : '<span class="status-github"><span class="status-icon status-ko">✗</span> <span class="status-text">KO</span></span>'
                        }
                    </td>
                    <td>${tagsHtml || '-'}</td>
                    <td>
                        ${project.hasGithub
                            ? `<a href="https://github.com/mondary/${project.name}" class="github-link" target="_blank">Voir →</a>`
                            : '-'
                        }
                    </td>
                `;

                tbody.appendChild(row);
            });
        }

        renderTable(projects);

        // Sorting
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', function() {
                const column = this.dataset.sort;

                // Toggle direction
                if (currentSort.column === column) {
                    currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
                } else {
                    currentSort.column = column;
                    currentSort.direction = 'asc';
                }

                // Update header styles
                document.querySelectorAll('th[data-sort]').forEach(h => {
                    h.classList.remove('sort-asc', 'sort-desc');
                });
                this.classList.add('sort-' + currentSort.direction);

                // Sort data
                const sorted = [...currentFilteredProjects].sort((a, b) => {
                    let valA, valB;

                    switch(column) {
                        case 'name':
                            valA = a.name.toLowerCase();
                            valB = b.name.toLowerCase();
                            break;
                        case 'category':
                            valA = a.category;
                            valB = b.category;
                            break;
                        case 'local':
                            valA = a.hasLocal ? 1 : 0;
                            valB = b.hasLocal ? 1 : 0;
                            break;
                        case 'github':
                            valA = a.hasGithub ? 1 : 0;
                            valB = b.hasGithub ? 1 : 0;
                            break;
                        case 'status':
                            valA = a.tags.length;
                            valB = b.tags.length;
                            break;
                        case 'link':
                            valA = a.hasGithub ? 1 : 0;
                            valB = b.hasGithub ? 1 : 0;
                            break;
                        default:
                            return 0;
                    }

                    if (valA < valB) return currentSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return currentSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                renderTable(sorted);
            });
        });

        // Search
        document.getElementById('search').addEventListener('input', function(e) {
            const search = e.target.value.toLowerCase();
            const filtered = projects.filter(p => p.name.toLowerCase().includes(search));
            currentFilteredProjects = filtered;
            renderTable(filtered);
        });
    </script>
</body>
</html>
